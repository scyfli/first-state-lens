name: DGI ETL

# Triggers:
#   - Schedule: first Sunday of each month at 09:00 UTC (data refresh)
#   - Manual dispatch: any pusher can trigger via the Actions UI
#   - Pull requests touching etl/: smoke tests only (no live network)
#   - Pushes to main touching etl/: smoke tests + (when input.commit_data
#     is true on dispatch) a live ETL run that commits data/* back

on:
  schedule:
    # 09:00 UTC, first Sunday of the month.
    - cron: "0 9 1-7 * 0"
  workflow_dispatch:
    inputs:
      reason:
        description: "Why is this run being triggered manually?"
        required: false
        default: "manual refresh"
      live_run:
        description: "Run the full live ETL (pulls every source from the network)?"
        type: boolean
        required: false
        default: true
      commit_data:
        description: "If live_run, commit dgi-food-access/data/ outputs back to main?"
        type: boolean
        required: false
        default: false
  pull_request:
    paths:
      - "etl/**"
      - ".github/workflows/dgi-etl.yml"
  push:
    branches: [main]
    paths:
      - "etl/**"
      - ".github/workflows/dgi-etl.yml"

permissions:
  contents: read

jobs:
  smoke-tests:
    name: Smoke tests (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: etl/requirements.txt

      - name: Install full ETL dependencies (lightweight + geo stack)
        # S+3 added the geo stack (geopandas, shapely, tobler, pyproj) for
        # transforms. Tests that require it use pytest.importorskip(), so
        # this install must succeed for transform tests to run. Linux GDAL
        # wheels install cleanly; Windows local dev still relies on the
        # importorskip path when geo isn't installed.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r etl/requirements.txt

      - name: Run smoke tests
        run: python -m pytest etl/tests/ -v

      - name: Lint requirements.txt parses
        run: |
          python -c "import re, pathlib; \
            text = pathlib.Path('etl/requirements.txt').read_text(); \
            assert 'requests' in text, 'requirements.txt missing requests'; \
            assert 'tobler' in text, 'requirements.txt missing tobler (S+3 geo stack)'; \
            print('requirements.txt OK')"

  live-etl:
    # Live ETL hits every external source: USDA, Census, FirstMap, DART, MMG,
    # DSB, TIGER. Skipped on PR (no network surface from forks) and skipped on
    # push (only schedule and explicit workflow_dispatch trigger this).
    name: Live ETL run + data publish
    needs: smoke-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
       github.event.inputs.live_run == 'true')
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout (full history; we may commit back)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: etl/requirements.txt

      - name: Install full ETL dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r etl/requirements.txt

      - name: Run live ETL (--pull --strict)
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: |
          python -m etl.run_etl \
            --pull \
            --strict \
            --raw-dir etl/raw \
            --output-dir dgi-food-access/data

      - name: Validate datapackage.json is well-formed
        run: |
          python -c "import json, pathlib; \
            payload = json.loads(pathlib.Path('dgi-food-access/data/datapackage.json').read_text()); \
            assert payload.get('name'), 'datapackage missing name'; \
            assert payload.get('resources'), 'datapackage missing resources'; \
            print(f\"datapackage version {payload.get('version')} ok with {len(payload['resources'])} resource(s)\")"

      - name: Upload data artifact (always; cheap)
        uses: actions/upload-artifact@v4
        with:
          name: dgi-food-access-data-${{ github.run_number }}
          path: dgi-food-access/data/
          if-no-files-found: error
          retention-days: 90

      - name: Commit data back to main (only when input.commit_data == true)
        if: |
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.commit_data == 'true'
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dgi-food-access/data/
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          REASON="${{ github.event.inputs.reason }}"
          git commit -m "DGI ETL live run: refresh data/* (workflow_dispatch: ${REASON})"
          git push origin HEAD:main
