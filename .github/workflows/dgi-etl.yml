name: DGI ETL

# Triggers:
#   - Schedule: first Sunday of each month at 09:00 UTC (data refresh)
#   - Manual dispatch: any pusher can trigger via the Actions UI
#   - Pull requests touching etl/: dry-run (smoke tests only; no published outputs)
#
# At S+1 this workflow only runs the smoke test suite. Real data publication
# lands at S+4 when transforms are complete and the methodology page flips
# `publish: true`. See etl/README.md for the sequencing.

on:
  schedule:
    # 09:00 UTC, first Sunday of the month.
    - cron: "0 9 1-7 * 0"
  workflow_dispatch:
    inputs:
      reason:
        description: "Why is this run being triggered manually?"
        required: false
        default: "manual refresh"
  pull_request:
    paths:
      - "etl/**"
      - ".github/workflows/dgi-etl.yml"
  push:
    branches: [main]
    paths:
      - "etl/**"
      - ".github/workflows/dgi-etl.yml"

permissions:
  contents: read

jobs:
  smoke-tests:
    name: Smoke tests (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: etl/requirements.txt

      - name: Install full ETL dependencies (lightweight + geo stack)
        # S+3 added the geo stack (geopandas, shapely, tobler, pyproj) for
        # transforms. Tests that require it use pytest.importorskip(), so
        # this install must succeed for transform tests to run. Linux GDAL
        # wheels install cleanly; Windows local dev still relies on the
        # importorskip path when geo isn't installed.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r etl/requirements.txt

      - name: Run smoke tests
        run: python -m pytest etl/tests/ -v

      - name: Lint requirements.txt parses
        run: |
          python -c "import re, pathlib; \
            text = pathlib.Path('etl/requirements.txt').read_text(); \
            assert 'requests' in text, 'requirements.txt missing requests'; \
            assert 'tobler' in text, 'requirements.txt missing tobler (S+3 geo stack)'; \
            print('requirements.txt OK')"

  # S+4 and onward will add a second job here that:
  #   - runs each puller against live sources
  #   - executes the full end-to-end pipeline (run_etl.py)
  #   - validates the datapackage
  #   - commits outputs back to main (only on schedule/workflow_dispatch, not PR)
  #
  # That job is intentionally NOT wired up at S+3 because:
  #   1. The dashboard frontend doesn't consume the outputs yet
  #   2. Live-source pullers + the orchestrator wire-up needs to ride a
  #      methodology page flip to publish: true
  #   3. Publishing data without a wired-up dashboard would surface
  #      unreviewed methodology numbers prematurely
  #
  # See the design brief §"Refresh cadence" for the eventual full workflow.
