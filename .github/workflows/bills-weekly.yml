name: Bills (full session) weekly

# Every bill and resolution of the current General Assembly session, from the legislature's
# own keyless JSON (etl/sources/de_legis_bills.py), then the static index
# (etl/pages/bill_tracker_pages.py). Its own job because a first or full run reads every
# action log at one request every 2 seconds (about an hour); refresh-all has a 30-minute cap.
# Weekly runs re-read only new, changed or recently active bills; on the 1st of the month
# the run is --full so long-quiet bills are re-read too. Commits only when output changed.

on:
  schedule:
    - cron: "0 10 * * 2"   # Tuesdays 10:00 UTC
  workflow_dispatch:
    inputs:
      full:
        description: "Re-read every action log (about an hour)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  bills:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: fsl-main-writers
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: etl/requirements.txt
      - run: python -m pip install -r etl/requirements.txt
      - name: Pull the session and rebuild the index
        run: |
          set -euo pipefail
          FULL=""
          if [ "${{ github.event.inputs.full }}" = "true" ] || [ "$(date -u +%d)" -le 07 ]; then FULL="--full"; fi
          python -m etl.sources.de_legis_bills --out bill-tracker/data $FULL
          python -m etl.pages.bill_tracker_pages
      - name: Commit if changed
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          scripts/publish-refresh.sh "bills-weekly: session bill list refresh" bill-tracker/data bill-tracker/index.html
