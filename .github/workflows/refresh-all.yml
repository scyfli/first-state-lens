name: Refresh All Dashboards

# Refreshes the six main-suite dashboards from their live sources and commits the
# updated data/*.json back to main (Cloudflare Pages then auto-deploys). This is the
# durability fix: before this workflow, only bill-tracker + dgi ran on cron, so
# schools/childcare/spending/federal/water/votes were frozen at the 2026-06-15 build.
#
# Keyless pullers: schools (DE Socrata), spending (DE Checkbook), water (EPA), federal
# (USAspending). Keyed pullers (secrets already exist in the repo): childcare (CENSUS_API_KEY),
# votes (OPENSTATES_API_KEY). FEC finance is added here once its api.data.gov key is a secret.
#
# A single source outage does NOT abort the run — each puller runs independently and only
# the dashboards that refreshed cleanly are committed (the pullers carry silent-zero guards,
# so a puller either writes real data or errors out, never partial/zero).

on:
  schedule:
    # Mondays 09:00 UTC (~05:00 ET) — weekly refresh.
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      reason:
        description: "Why is this run being triggered?"
        required: false
        default: "manual refresh"
      commit_data:
        description: "Commit the refreshed data/* back to main?"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  refresh:
    name: Pull all sources + publish data
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout (full history; we commit back)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: etl/requirements.txt

      - name: Install ETL dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r etl/requirements.txt

      - name: Run all dashboard pullers
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          OPENSTATES_API_KEY: ${{ secrets.OPENSTATES_API_KEY }}
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
        run: |
          set -uo pipefail
          # Latest COMPLETE federal fiscal year (fed FY ends Sept 30): Oct+ = current year, else year-1.
          FED_FY=$(python3 -c "import datetime as d; t=d.datetime.utcnow(); print(t.year if t.month>=10 else t.year-1)")
          echo "Federal fiscal year: $FED_FY"
          fail=0
          run() {
            local label="$1"; shift
            echo "::group::$label"
            if python -m "$@"; then echo "OK: $label"; else echo "FAILED: $label"; fail=1; fi
            echo "::endgroup::"
          }
          run "Schools"   etl.sources.de_report_card
          run "Spending"  etl.sources.de_checkbook
          run "Water"     etl.sources.epa_sdwa_de
          run "Federal"   etl.sources.usaspending_de --fy "$FED_FY"
          run "Childcare" etl.sources.firstmap_childcare
          run "Votes"     etl.sources.openstates_de
          run "CampaignFinance" etl.sources.fec_de
          run "Reassessment" etl.sources.kent_reassessment --out reassessment/data
          if [ "$fail" -ne 0 ]; then
            echo "::warning::One or more pullers failed; committing only the dashboards that refreshed cleanly."
          fi

      - name: Upload refreshed data artifact
        uses: actions/upload-artifact@v4
        with:
          name: fsl-data-${{ github.run_number }}
          path: |
            schools/data/
            spending/data/
            water/data/
            federal/data/
            childcare/data/
            votes/data/
            campaign-finance/data/
            reassessment/data/
          if-no-files-found: warn
          retention-days: 90

      - name: Commit refreshed data back to main
        if: github.event_name == 'schedule' || github.event.inputs.commit_data == 'true'
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schools/data spending/data water/data federal/data childcare/data votes/data campaign-finance/data reassessment/data
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          REASON="${{ github.event.inputs.reason || 'scheduled weekly refresh' }}"
          git commit -m "refresh-all: dashboard data refresh (${REASON})"
          git push origin HEAD:main
